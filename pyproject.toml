[project]
name = "telegram-registration-bot"
version = "0.1.0"
description = "A multilingual Telegram registration and option-based content bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.20,<4",
    "aiosqlite>=0.22.1,<0.23",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0.38,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
