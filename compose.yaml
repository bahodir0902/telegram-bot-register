name: telegram-registration-bot

services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE must be an immutable GHCR image digest}
    env_file:
      - ${BOT_ENV_FILE:-./bot.env}
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
      MEDIA_ROOT: /app/media
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,uid=10001,gid=10001,mode=1777
    volumes:
      - bot_data:/app/data
      - bot_media:/app/media
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot_data:
    name: telegram-registration-bot-data
  bot_media:
    name: telegram-registration-bot-media
